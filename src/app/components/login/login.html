<div class="login-container">
  <div class="login-card">
    <h1>🍽️ Restaurante Don Belisario</h1>
    <h2>Mozo - Iniciar Sesión</h2>
    
    <form (ngSubmit)="login()">
      <div class="form-group">
        <label>Usuario</label>
        <input type="text" [(ngModel)]="usuario" name="usuario" placeholder="Ingresa tu usuario" required>
      </div>
      
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" [(ngModel)]="password" name="password" placeholder="Ingresa tu contraseña" required>
      </div>
      
      <button type="submit" class="btn-login">Ingresar</button>
    </form>
    
    <p class="error" *ngIf="error">{{ error }}</p>
  </div>
</div>
